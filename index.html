<!DOCTYPE html>
<html lang="en">
<head>

    <title>24 Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2C3E50;
            --light: #F7F9FC;
            --success: #2ECC71;
            --error: #E74C3C;
            --card-bg: #FFFFFF;
            --shadow: 0 4px 20px rgba(0,0,0,0.15);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .game-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-item {
            font-size: 12px;
            font-weight: 600;
            color: var(--dark);
            text-align: center;
        }

        .header-item span {
            color: var(--primary);
            font-size: 18px;
            display: block;
        }

        .multiplier {
            color: var(--success) !important;
        }

        .streak {
            color: var(--accent) !important;
        }

        .difficulty-badge {
            background: var(--secondary);
            color: white;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 10px;
            text-transform: uppercase;
        }

        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .numbers-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .number-card {
            width: 70px;
            height: 90px;
            background: var(--card-bg);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: var(--dark);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
            border: 3px solid transparent;
        }

        .number-card:active {
            transform: scale(0.95);
        }

        .number-card.selected {
            border-color: var(--primary);
            background: #FFF0F0;
            transform: translateY(-4px);
        }

        .number-card.used {
            opacity: 0.3;
            pointer-events: none;
        }

        .expression-area {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }

        .expression {
            font-size: 28px;
            font-weight: 600;
            color: var(--dark);
            text-align: center;
            word-break: break-all;
        }

        .result.correct {
            color: var(--success);
        }

        .result.wrong {
            color: var(--error);
        }

        .operators-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .operator-btn {
            width: 60px;
            height: 60px;
            background: var(--card-bg);
            border: none;
            border-radius: 16px;
            font-size: 28px;
            font-weight: 700;
            color: var(--dark);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Fredoka', sans-serif;
        }

        .operator-btn:active {
            transform: scale(0.95);
        }

        .operator-btn.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .actions-row {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .btn-undo {
            background: var(--accent);
            color: var(--dark);
        }

        .btn-clear {
            background: var(--error);
            color: white;
        }

        .btn-submit {
            background: var(--success);
            color: white;
            font-size: 18px;
        }

        .btn-hint {
            background: var(--secondary);
            color: white;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            padding: 32px;
            border-radius: 24px;
            text-align: center;
            max-width: 90%;
            width: 340px;
            box-shadow: var(--shadow-lg);
            transform: scale(0.8);
            transition: all 0.3s ease;
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .modal h2 {
            font-size: 28px;
            margin-bottom: 16px;
            color: var(--dark);
        }

        .modal p {
            font-size: 18px;
            color: #666;
            margin-bottom: 24px;
        }

        .modal-btn {
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 6px;
        }

        .modal-btn.primary {
            background: var(--primary);
            color: white;
        }

        .modal-btn.secondary {
            background: var(--light);
            color: var(--dark);
        }

        .mode-btn {
            display: block;
            width: 100%;
            padding: 20px;
            margin: 10px 0;
            border: 3px solid var(--light);
            border-radius: 16px;
            background: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--dark);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .mode-btn:hover, .mode-btn.selected {
            border-color: var(--primary);
            background: #FFF5F5;
        }

        .mode-btn small {
            display: block;
            font-size: 12px;
            color: #888;
            font-weight: 400;
            margin-top: 4px;
        }

        .hint-text {
            font-size: 14px;
            color: var(--secondary);
            text-align: center;
            padding: 8px;
            background: rgba(78, 205, 196, 0.1);
            border-radius: 8px;
            margin-top: 8px;
            display: none;
        }

        .hint-text.visible {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .practice-notice {
            background: var(--secondary);
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.3s ease;
        }

        .difficulty-selector {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 16px 0;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 10px 20px;
            border: 2px solid var(--light);
            border-radius: 12px;
            background: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .difficulty-btn.selected {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }
    </style>
</head>

                <button class="action-btn btn-clear" id="clearBtn">🗑️ Clear</button>
                <button class="action-btn btn-hint" id="hintBtn">💡 Hint</button>
            </div>

            <button class="action-btn btn-submit" id="submitBtn">✓ Submit</button>
        </div>
    </div>

    <div class="modal" id="modeModal">
        <div class="modal-content">
            <h2>🎮 24 Game</h2>
            <p>Choose your game mode:</p>
            
            <button class="mode-btn selected" id="curatedBtn">

            <div id="difficultySelect" style="display: none;">

                    <button class="difficulty-btn" data-diff="medium">Medium</button>
                    <button class="difficulty-btn" data-diff="hard">Hard</button>
                </div>
            </div>
            
            <button class="modal-btn primary" id="startGameBtn" style="margin-top: 16px;">Start Game</button>
        </div>
    </div>

    <div class="modal" id="successModal">
        <div class="modal-content">
            <h2>🎉 Correct!</h2>
            <p id="successMsg">+100 points</p>
            <button class="modal-btn primary" id="nextBtn">Next Level →</button>
        </div>
    </div>

    <div class="modal" id="failModal">
        <div class="modal-content">
            <h2>😢 Not 24</h2>
            <p>Your expression equals <span id="wrongResult">0</span></p>
            <button class="modal-btn primary" id="retryBtn">Try Again</button>
        </div>
    </div>

    <div class="modal" id="timeoutModal">
        <div class="modal-content">
            <h2>⏰ Time's Up!</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button class="modal-btn primary" id="restartBtn">Play Again</button>
        </div>
    </div>

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playTone(freq, duration, type = 'sine') {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        function playSound(type) {
            initAudio();
            switch(type) {
                case 'select': playTone(600, 0.1); break;
                case 'operator': playTone(800, 0.1); break;
                case 'correct':
                    playTone(523, 0.15);
                    setTimeout(() => playTone(659, 0.15), 100);
                    setTimeout(() => playTone(784, 0.2), 200);
                    break;
                case 'wrong': playTone(200, 0.3, 'sawtooth'); break;
                case 'hint': playTone(400, 0.1); setTimeout(() => playTone(500, 0.1), 100); break;
            }
        }

        function generatePuzzle() {
            const diff = gameState.difficulty;
            let numRange, ops;

            if (gameState.mode === 'generated') {
                const level = gameState.level;
                if (level <= 10) { numRange = [1, 10]; ops = ['+', '−']; }
                else if (level <= 20) { numRange = [1, 9]; ops = ['+', '−', '×']; }
                else { numRange = [1, 13]; ops = ['+', '−', '×', '÷']; }
            } else {
                if (diff === 'easy') { numRange = [1, 10]; ops = ['+', '−']; }
                else if (diff === 'medium') { numRange = [1, 9]; ops = ['+', '−', '×']; }
                else { numRange = [1, 13]; ops = ['+', '−', '×', '÷']; }
            }

            while (true) {
                const nums = [];
                for (let i = 0; i < 4; i++) {
                    nums.push(Math.floor(Math.random() * (numRange[1] - numRange[0] + 1)) + numRange[0]);
                }
                
                const uniqueNums = [...new Set(nums)];
                if (uniqueNums.length < 2) continue;
                
                const solutions = findSolutions(nums, ops);
                if (solutions.length > 0) {
                    currentNumbers = nums.map(n => ({ value: n, used: false }));
                    return { numbers: currentNumbers, solution: solutions[0] };
                }
            }
        }

        function findSolutions(nums, allowedOps = ['+', '−', '×', '÷']) {
            const results = [];
            const ops = allowedOps;
            
            function permute(arr) {
                if (arr.length === 0) return [[]];
                const result = [];
                for (let i = 0; i < arr.length; i++) {
                    const rest = permute(arr.slice(0, i).concat(arr.slice(i + 1)));
                    for (const r of rest) result.push([arr[i]].concat(r));
                }
                return result;
            }

            function generateOps(count) {
                if (count === 1) return ops.map(o => [o]);
                const result = [];
                for (const first of ops) {
                    for (const rest of generateOps(count - 1)) result.push([first, ...rest]);
                }
                return result;
            }

            function evalOp(a, b, op) {
                switch(op) {
                    case '+': return a + b;
                    case '−': return a - b;
                    case '×': return a * b;
                    case '÷': return b !== 0 && a % b === 0 ? a / b : null;
                }
                return null;
            }

            for (const numPerm of permute(nums)) {
                for (const opCombo of generateOps(3)) {
                    let result = evalOp(numPerm[0], numPerm[1], opCombo[0]);
                    if (result === null) continue;
                    result = evalOp(result, numPerm[2], opCombo[1]);
                    if (result === null) continue;
                    result = evalOp(result, numPerm[3], opCombo[2]);
                    if (result === 24) {
                        results.push(`${numPerm[0]} ${opCombo[0]} ${numPerm[1]} ${opCombo[1]} ${numPerm[2]} ${opCombo[2]} ${numPerm[3]} = 24`);
                    }
                }
            }
            
            return [...new Set(results)].slice(0, 3);
        }

        function getTimerForLevel() {
            if (gameState.isPractice) return 0;
            if (gameState.mode === 'curated') {
                if (gameState.difficulty === 'easy') return 45;
                if (gameState.difficulty === 'medium') return 35;
                return 25;
            }
            return Math.max(30, 60 - Math.floor(gameState.level / 2));
        }

        function renderNumbers() {
            const container = document.getElementById('numbers');
            container.innerHTML = '';
            currentNumbers.forEach((num, idx) => {
                const card = document.createElement('div');
                card.className = `number-card${num.used ? ' used' : ''}`;
                card.textContent = num.value;
                card.onclick = () => selectNumber(idx);
                container.appendChild(card);
            });
        }

        function renderOperators() {
            const container = document.getElementById('operators');
            container.innerHTML = '';
            const allowedOps = gameState.mode === 'generated' && gameState.level <= 10 ? ['+', '−'] :
                              gameState.mode === 'curated' && gameState.difficulty === 'easy' ? ['+', '−'] :
                              ['+', '−', '×', '÷'];
            
            OPERATORS.forEach(op => {
                const btn = document.createElement('button');
                btn.className = `operator-btn${!allowedOps.includes(op) ? ' disabled' : ''}`;
                btn.textContent = op;
                btn.onclick = () => allowedOps.includes(op) && selectOperator(op);
                container.appendChild(btn);
            });
        }

        function selectNumber(idx) {
            if (!gameState.started || currentNumbers[idx].used) return;
            playSound('select');
            
            if (selectedNumbers.includes(idx)) {
                selectedNumbers = selectedNumbers.filter(i => i !== idx);
                currentNumbers[idx].used = false;
            } else {
                const expectedOps = selectedNumbers.length;
                if (selectedOperators.length < expectedOps) return;
                
                if (selectedNumbers.length < 4) {
                    selectedNumbers.push(idx);
                    currentNumbers[idx].used = true;
                }
            }
            renderNumbers();
            updateExpression();
        }

        function selectOperator(op) {
            if (!gameState.started) return;
            playSound('operator');
            
            if (selectedOperators.length < 3) {
                selectedOperators.push(op);
                updateExpression();
            }
        }

        function updateExpression() {
            const container = document.getElementById('expression');
            
            if (selectedNumbers.length === 0 && selectedOperators.length === 0) {
                container.innerHTML = '<span style="color: #999;">Tap numbers & operators</span>';
                return;
            }

            let html = '';
            for (let i = 0; i < selectedNumbers.length; i++) {
                html += `<span style="color: var(--primary)">${currentNumbers[selectedNumbers[i]].value}</span>`;
                if (i < selectedOperators.length) {
                    html += ` <span style="color: var(--secondary)">${selectedOperators[i]}</span> `;
                }
            }
            container.innerHTML = html;
        }

        function undo() {
            if (!gameState.started) return;
            
            if (selectedNumbers.length > selectedOperators.length) {
                const lastIdx = selectedNumbers.pop();
                currentNumbers[lastIdx].used = false;
                renderNumbers();
            } else if (selectedOperators.length > 0) {
                selectedOperators.pop();
            }
            updateExpression();
        }

        function clearAll() {
            selectedNumbers = [];
            selectedOperators = [];
            currentNumbers.forEach(n => n.used = false);
            renderNumbers();
            updateExpression();
            document.getElementById('hint').classList.remove('visible');
        }

        function evaluateExpression() {
            if (selectedNumbers.length !== 4 || selectedOperators.length !== 3) return null;
            
            const nums = selectedNumbers.map(i => currentNumbers[i].value);
            
            function evalOp(a, b, op) {
                switch(op) {
                    case '+': return a + b;
                    case '−': return a - b;
                    case '×': return a * b;
                    case '÷': return b !== 0 && a % b === 0 ? a / b : null;
                }
                return null;
            }

            let result = evalOp(nums[0], nums[1], selectedOperators[0]);
            if (result === null) return null;
            
            result = evalOp(result, nums[2], selectedOperators[1]);
            if (result === null) return null;
            
            result = evalOp(result, nums[3], selectedOperators[2]);
            
            return result;
        }

        function submit() {
            if (!gameState.started) return;
            
            const result = evaluateExpression();
            
            if (selectedNumbers.length !== 4 || selectedOperators.length !== 3) {
                playSound('wrong');
                document.getElementById('wrongResult').textContent = 'incomplete';
                document.getElementById('failModal').classList.add('active');
                document.querySelector('.game-area').classList.add('shake');
                setTimeout(() => document.querySelector('.game-area').classList.remove('shake'), 300);
                return;
            }
            
            if (result === 24) {
                playSound('correct');
                const points = Math.round((100 + (gameState.timer * 2)) * gameState.multiplier);
                gameState.score += points;
                gameState.streak++;
                updateMultiplier();
                updateUI();
                document.getElementById('successMsg').textContent = `+${points} points`;
                document.getElementById('successModal').classList.add('active');
                clearInterval(timerInterval);
            } else {
                playSound('wrong');
                gameState.streak = 0;
                gameState.multiplier = 1.0;
                updateUI();
                document.getElementById('wrongResult').textContent = result !== null ? result : 'invalid';
                document.getElementById('failModal').classList.add('active');
                document.querySelector('.game-area').classList.add('shake');
                setTimeout(() => document.querySelector('.game-area').classList.remove('shake'), 300);
            }
        }

        function showHint() {
            playSound('hint');
            const hintEl = document.getElementById('hint');
            if (currentSolution) {
                hintEl.textContent = `💡 ${currentSolution}`;
                hintEl.classList.add('visible');
            }
        }

        function updateMultiplier() {
            if (gameState.streak >= 6) gameState.multiplier = 2.0;
            else if (gameState.streak >= 3) gameState.multiplier = 1.5;
            else gameState.multiplier = 1.0;
        }

        function updateUI() {
            document.getElementById('level').textContent = gameState.level;
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('streak').textContent = gameState.streak;
            document.getElementById('multiplier').textContent = gameState.multiplier.toFixed(1);
            
            const diffEl = document.getElementById('difficulty');
            if (gameState.mode === 'curated') {
                diffEl.textContent = gameState.difficulty.toUpperCase();
            } else if (gameState.mode === 'generated') {
                const tiers = ['EASY', 'EASY', 'MED', 'MED', 'HARD'];
                diffEl.textContent = tiers[Math.min(4, Math.floor(gameState.level / 10))];
            } else {
                diffEl.textContent = 'PRACTICE';
            }
        }

        function startGame() {
            document.getElementById('modeModal').classList.remove('active');
            
            gameState.started = true;
            gameState.timer = getTimerForLevel();
            gameState.maxTime = gameState.timer;
            
            document.getElementById('timer').textContent = gameState.timer;
            document.getElementById('timerContainer').style.display = gameState.isPractice ? 'none' : 'block';
            document.getElementById('progressContainer').style.display = gameState.isPractice ? 'none' : 'block';
            document.getElementById('practiceNotice').style.display = gameState.isPractice ? 'block' : 'none';
            
            loadPuzzle();
            startTimer();
        }

        function loadPuzzle() {
            selectedNumbers = [];
            selectedOperators = [];
            
            if (gameState.mode === 'curated') {
                const puzzles = CURATED_PUZZLES[gameState.difficulty];
                let idx = gameState.currentPuzzleIndex;
                
                while (gameState.solvedPuzzles.includes(idx) && gameState.solvedPuzzles.length < puzzles.length) {
                    idx = (idx + 1) % puzzles.length;
                }
                
                if (gameState.solvedPuzzles.length >= puzzles.length) {
                    document.getElementById('completeModal').classList.add('active');
                    return;
                }
                
                gameState.currentPuzzleIndex = idx;
                const puzzle = puzzles[idx];
                currentNumbers = puzzle.nums.map(n => ({ value: n, used: false }));
                currentSolution = puzzle.hint;
            } else {
                const puzzle = generatePuzzle();
                currentNumbers = puzzle.numbers;
                currentSolution = puzzle.solution;
            }
            
            renderNumbers();
            renderOperators();
            updateExpression();
            updateUI();
            document.getElementById('hint').classList.remove('visible');
        }

        function startTimer() {
            clearInterval(timerInterval);
            
            if (gameState.isPractice) return;
            
            timerInterval = setInterval(() => {
                gameState.timer--;
                document.getElementById('timer').textContent = gameState.timer;
                document.getElementById('progress').style.width = `${(gameState.timer / gameState.maxTime) * 100}%`;
                
                if (gameState.timer <= 0) {
                    clearInterval(timerInterval);
                    gameState.streak = 0;
                    gameState.multiplier = 1.0;
                    document.getElementById('finalScore').textContent = gameState.score;
                    document.getElementById('timeoutModal').classList.add('active');
                }
            }, 1000);
        }

        function nextLevel() {
            document.getElementById('successModal').classList.remove('active');
            
            if (gameState.mode === 'curated') {
                gameState.solvedPuzzles.push(gameState.currentPuzzleIndex);
                if (gameState.solvedPuzzles.length >= CURATED_PUZZLES[gameState.difficulty].length) {
                    document.getElementById('completeModal').classList.add('active');
                    return;
                }
            } else {
                gameState.level++;
            }
            
            gameState.timer = getTimerForLevel();
            gameState.maxTime = gameState.timer;
            document.getElementById('timer').textContent = gameState.timer;
            document.getElementById('progress').style.width = '100%';
            
            loadPuzzle();
            startTimer();
        }

        function retryLevel() {
            document.getElementById('failModal').classList.remove('active');
        }

        function showModeSelect() {
            document.getElementById('modeModal').classList.add('active');
            document.getElementById('successModal').classList.remove('active');
            document.getElementById('failModal').classList.remove('active');
            document.getElementById('timeoutModal').classList.remove('active');
            document.getElementById('completeModal').classList.remove('active');
        }

        function resetGame() {
            gameState = {
                mode: 'curated',
                difficulty: 'easy',
                level: 1,
                score: 0,
                streak: 0,
                multiplier: 1.0,
                timer: 60,
                maxTime: 60,
                isPractice: false,
                currentPuzzleIndex: 0,
                solvedPuzzles: [],
                started: false
            };
            showModeSelect();
        }

        document.getElementById('curatedBtn').onclick = function() {
            gameState.mode = 'curated';
            gameState.isPractice = false;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
            this.classList.add('selected');
            document.getElementById('difficultySelect').style.display = 'block';
        };

        document.getElementById('generatedBtn').onclick = function() {
            gameState.mode = 'generated';
            gameState.isPractice = false;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
            this.classList.add('selected');
            document.getElementById('difficultySelect').style.display = 'none';
        };

        document.getElementById('practiceBtn').onclick = function() {
            gameState.mode = 'curated';
            gameState.isPractice = true;
            gameState.difficulty = 'easy';
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
            this.classList.add('selected');
            document.getElementById('difficultySelect').style.display = 'none';
        };

        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.onclick = function() {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                gameState.difficulty = this.dataset.diff;
            };
        });

        document.getElementById('startGameBtn').onclick = startGame;
        document.getElementById('nextBtn').onclick = nextLevel;
        document.getElementById('retryBtn').onclick = retryLevel;
        document.getElementById('restartBtn').onclick = resetGame;
        document.getElementById('completeBtn').onclick = resetGame;
        document.getElementById('undoBtn').onclick = undo;
        document.getElementById('clearBtn').onclick = clearAll;
        document.getElementById('submitBtn').onclick = submit;
        document.getElementById('hintBtn').onclick = showHint;

        document.getElementById('modeModal').classList.add('active');
    </script>
</body>
</html>
